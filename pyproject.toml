[project]
name = "language-model-autoresearch"
version = "0.1.0"
description = "An agent's loop that trains a small language model and keeps what lowers val_bpb"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "tiktoken>=0.11.0",
    "torch==2.9.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
